note: >-
  Membrane is an EMBEDDED integration platform, so its client-side component surface is a product
  in its own right rather than an SDK afterthought: the components are how a customer's end users
  see and authorise their own integrations inside the customer's app. Distinct from the packages
  in packages/ - the loader libraries are listed there, the component families here.
loaders:
