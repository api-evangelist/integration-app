element_lifecycle:
  note: >-
    Distinct from API lifecycle, and worth recording because it is the model an agent actually acts
    on: every workspace element moves through create -> archive (DELETE) -> restore, stays queryable
    while archived via includeArchived=true, and connectors additionally carry explicit versions
    (GET /connectors/{key}/versions, publishConnectorVersion, deleteConnectorVersion). See the
    reversibility block in conventions/integration-app-conventions.yml.
rebrand:
