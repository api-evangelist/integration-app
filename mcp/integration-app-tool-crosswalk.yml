    selects which other tools to expose for a session and has no REST analogue.
rest_only_note: >-
  The overwhelming majority of the REST surface has no tool. The integrate-anything tool set is a
  deliberately small agent-facing slice - connect, discover, run - over a 278-operation platform API.
  Whole tag families are REST-only: Connectors (20 ops), Integrations (16), ExternalEventSubscriptions
  (15), FieldMappings (14), DataLinkTables (13), Packages (13), DataSources (12), ExternalEventTypes
  (12), Flows (12), AppEventTypes (11), AppDataSchemas (10), AppEventSubscriptions (10),
  DataCollections (10), FlowRuns (9), OrgWorkspaces (9), Sessions (7), ConnectedProducts (7),
  Customers (7), and the log readers. None is reachable through the published tool definitions.
