  version: 0.29.2
  framework: React
  docs: https://docs.getmembrane.com/docs/ways-to-use-membrane/sdk/react
- package: '@membranehq/react'
  framework: Vue.js
  via: Vue composables wrapping the core SDK
  docs: https://docs.getmembrane.com/docs/ways-to-use-membrane/sdk/vue
- package: '@membranehq/sdk'
  framework: framework-agnostic
  note: >-
    The docs publish a "Connection UI Without the Front-End SDK" path, so the embedded surface can
    be driven from a plain browser app or a server-rendered page.
  docs: https://docs.getmembrane.com/docs/ways-to-use-membrane/embedded-ui/connection-ui/connection-ui-without-the-front-end-sdk
