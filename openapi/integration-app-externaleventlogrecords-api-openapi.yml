paths:
  /external-event-log-records:
    get:
      operationId: listExternalEventLogRecords
      parameters:
      - name: limit
        required: false
        in: query
        description: Maximum number of items to return (1-1000)
        schema:
          minimum: 1
          maximum: 1000
          type: integer
      - name: cursor
        required: false
        in: query
        description: Pagination cursor from a previous response
        schema:
          type: string
      - name: tenantId
        required: false
        in: query
        schema:
          type: string
      - name: userId
        required: false
        in: query
        schema:
          type: string
      - name: connectionId
        required: false
        in: query
        schema:
          type: string
      - name: integrationId
        required: false
        in: query
        schema:
          type: string
      - name: externalEventSubscriptionId
        required: false
        in: query
        schema:
          type: string
      - name: externalEventTypeId
        required: false
        in: query
        schema:
          type: string
      - name: status
        required: false
        in: query
