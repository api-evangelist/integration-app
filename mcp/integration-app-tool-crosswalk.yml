  publishes the integrate-anything tool definitions as TypeScript, and each definition ends in a
  literal client.request(<METHOD>, <PATH>) call. Every row below was checked against the published
  OpenAPI, so `high` confidence means the operationId was found in the spec, not that the names
  looked similar. The one tool pair whose REST path is NOT in the published spec is recorded as
  mcp_only rather than guessed at.
