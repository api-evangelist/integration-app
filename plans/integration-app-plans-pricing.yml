description: >-
  Membrane publishes no pricing. This file replaces a 2026-05-04 bulk-sweep scaffold that invented a
  "Free" tier with placeholder limits; that tier was never published by the provider and is removed.
plan_count: 0
plans: []
finding: >-
  Membrane has WITHDRAWN its public pricing page rather than never having had one. On 2026-09-13
  https://getmembrane.com/pricing returns HTTP 301 to https://getmembrane.com/ (a 169-byte Cloudflare
  redirect, not a rendered page), and https://getmembrane.com/packages returns HTTP 301 to
  /universe. Both URLs are still indexed and still linked from third-party listings, so a buyer
  following a search result lands on the homepage with no explanation. The enterprise page describes
  scale and invites contact but names no number, no tier and no unit of billing. There is therefore
  no self-serve price, no published quota, and no overage schedule to record.
pricing_model:
  published: false
  self_serve_price: false
  free_tier_published: false
  contact_sales_only: true
  note: >-
    Signup at https://console.getmembrane.com is open and self-serve, so a developer can start
    without talking to sales; what they cannot do is find out what it costs. Access and price are
    different gates and only the price one is closed.
