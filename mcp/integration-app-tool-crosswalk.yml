    Calls POST /connection-requests, which does not appear anywhere in the published OpenAPI. The
    endpoint is real (the provider's own tool file calls it), but Membrane has not documented it in
    the machine-readable contract, so an agent working from the OpenAPI alone cannot start an
    end-user OAuth flow.
