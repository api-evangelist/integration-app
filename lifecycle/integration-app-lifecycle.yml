  to: Membrane
  evidence: >-
    npm scope moved from @integration-app to @membranehq, with the last @integration-app/sdk release
    on 2025-07-22 and the first @membranehq/sdk release on 2025-07-23. The @integration-app/react npm
    description now reads "Package has moved to @membranehq/react". The API host is
