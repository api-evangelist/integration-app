domain_standard:
  applicable: false
  note: >-
    REWARD-ONLY and deliberately left empty. Embedded iPaaS / unified-integration infrastructure has
    no domain message standard of its own - there is no SCIM/OData/HL7/ISO-20022 equivalent for
