versioning:
  scheme: X.Y contract version, pinned per request
  header: API-Version
  example: 'API-Version: 2.1'
  semantics: >-
    "The major version changes when there are breaking changes, and the minor version changes with
    any updates." Omitting the header uses the current version.
  in_url: false
  note: >-
    Versioning is a request header, not a URL path segment - https://api.getmembrane.com has no /v1.
    Contract versions 1.10, 1.11 and 1.12 are referenced in the changelog.
  docs: https://docs.getmembrane.com/docs/ways-to-use-membrane/rest-api
deprecation:
  policy_published: true
  policy_form: >-
    Breaking changes are gated behind a major contract version bump and callers pin with the
    API-Version header, which is a deprecation mechanism rather than a dated sunset policy. The
    changelog announces breaking changes per release (e.g. the 2026-08-12 SDK note renaming the
    external event subscription webhookUri field).
  sunset_header: false
  deprecation_header: false
  rfc8594: false
  note: >-
    No RFC 8594 Sunset or Deprecation response headers are documented, and no dated end-of-life
    schedule is published. An agent cannot learn from a response that an operation is going away.
  docs: https://docs.getmembrane.com/docs/ways-to-use-membrane/rest-api
