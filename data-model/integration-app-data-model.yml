note: >-
  Derived from the published OpenAPI's 263 component schemas and its id/key reference fields, then
  checked against the provider's workspace-elements reference for naming. Membrane's model has an
  unusual shape worth stating plainly: almost every entity is a "workspace element" that can be
  addressed by internal id OR by a caller-chosen key, is versioned in layers, can be archived and
  restored, and exists in a UNIVERSAL form (defined once) and an INSTANCE form (specialised per
  integration). Reading the graph without that in mind makes the API look duplicated.
identifier_conventions:
  dual_addressing: >-
    Elements take a {selector}, {idOrKey} or {elementSelector} path parameter accepting either the
    internal id or the key. 117 operations use one of these.
  id_field: id - "Internal database ID of the element. Assigned by the API; unique per element."
  key_field: key - caller-chosen, stable, used for configuration-as-code (membrane pull/push).
  instance_key: >-
    instanceKey (28 schemas) identifies the per-integration instance of a universal element.
  layer: >-
    A `layer` query parameter on 71 operations selects which configuration layer is being read or
    written (universal vs integration vs connection).
  id_prefixes_observed:
  - con_ (connection, from webhook payload examples)
  - int_ (integration)
  - fr_ (flow run)
  - cf_ (connection flow)
  - if_ (integration flow)
  - alrt_ (alert)
  - err_ (internal error id)
  id_prefix_note: >-
    Read from the provider's documented webhook payload examples, not from the spec, which types
    every id as a plain string.
