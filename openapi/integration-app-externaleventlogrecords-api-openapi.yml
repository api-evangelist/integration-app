          type: string
          enum:
          - created
          - error
          - success
      - name: externalAppId
        required: false
        in: query
        schema:
          type: string
      - name: from
        required: false
        in: query
        schema:
          type: string
      - name: to
        required: false
        in: query
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalEventLogRecordsPaginatedResponseDto'
      summary: List external event log records
      tags:
      - ExternalEventLogRecords
  /external-event-log-records/{id}:
    get:
      operationId: getExternalEventLogRecord
      parameters:
      - name: id
        required: true
        in: path
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalEventLogRecordApiResponseDto'
      summary: Get external event log record
      tags:
      - ExternalEventLogRecords
  /external-event-log-records/{id}/details:
    get:
      operationId: getExternalEventLogRecordDetails
      parameters:
      - name: id
        required: true
        in: path
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
