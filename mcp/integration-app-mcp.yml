tools_note: >-
  Anonymous tools/list is auth-gated (401), so no live inputSchema set was captured. The tool NAMES
  and their backing REST calls are nevertheless first-party and verifiable: the provider publishes
  tools/integrate-anything.ts in github.com/membranehq/agent-skills, which defines the same
  integrate-anything tool surface this endpoint is named for and shows the exact REST path each tool
  calls. Those 11 tools are recorded in mcp/integration-app-tool-crosswalk.yml, bound to verified
  operationIds in the published OpenAPI. They are NOT recorded here as a derived tool list.
  Membrane's hosted server is additionally dynamic: in static mode it returns every action available
  across a tenant's connected integrations, so the live tool set is tenant-specific and cannot be
  enumerated anonymously even with credentials to a different workspace.
modes:
  static: returns all available tools (actions) for every connected integration - the default
  dynamic: '?mode=dynamic returns a single `enable-tools` tool the agent calls to enable what it needs'
  source: https://github.com/membranehq/mcp-server#readme
